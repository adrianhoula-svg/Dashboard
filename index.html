<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Entrée</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#090c11;min-height:100%}
body{margin:0;min-height:100vh;color:#e9eef5;font-family:-apple-system,"SF Pro Display",Helvetica,Arial,sans-serif;background:radial-gradient(900px 520px at 8% -8%,#1b2b47 0%,rgba(9,12,17,0) 70%) no-repeat;padding:max(18px,env(safe-area-inset-top)) 26px 26px}
body.night{-webkit-filter:brightness(.4);filter:brightness(.4)}
.i{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.14em}
.i.f{fill:currentColor}
main{display:grid;grid-template-columns:1fr 1fr;grid-gap:26px}
@media (orientation:portrait){main{grid-template-columns:1fr}}
.col>*{margin-bottom:20px}
.card{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.07);border-radius:26px;padding:22px}
.lbl{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#7d8da3;margin:0 0 14px;display:flex;align-items:center}
.lbl .i{margin-right:8px;font-size:16px}
#hello{font-size:22px;color:#8ea2bb;letter-spacing:.02em}
#time{font-size:23vmin;font-weight:100;line-height:1;letter-spacing:-.03em;margin:4px 0 6px}
#date{font-size:26px;text-transform:capitalize;color:#c9d4e3}
#wx{display:flex;align-items:center;margin-top:30px}
#ico{font-size:68px;color:#8cc8ff;margin-right:20px}
#temp{font-size:58px;font-weight:200;line-height:1}
#cond{font-size:19px;color:#8ea2bb;margin-top:4px}
#city{margin-left:auto;align-self:flex-start}
#days{display:grid;grid-template-columns:repeat(3,1fr);grid-gap:12px;margin-top:20px}
.day{text-align:center;padding:14px 6px;border-radius:18px;background:rgba(255,255,255,.04);font-size:15px;color:#c9d4e3}
.day b{display:block;font-weight:500;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:#7d8da3}
.day .i{display:block;font-size:30px;margin:8px auto;color:#8cc8ff}
#tip{margin-top:16px;font-size:19px;color:#dbe6f5;display:flex;align-items:center}
#tip .i{font-size:26px;color:#8cc8ff;margin-right:12px;flex:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.chip{display:inline-flex;align-items:center;font-size:16px;color:#aab9cc;background:rgba(255,255,255,.06);border-radius:999px;padding:9px 15px;margin:0 8px 8px 0}
.chip .i{margin-right:7px;font-size:17px}
.chip.on{background:#8cc8ff;color:#0a1422}
#tabs{margin-bottom:6px}
.art{display:flex;align-items:center;text-decoration:none;color:inherit;padding:13px 0;border-top:1px solid rgba(255,255,255,.07)}
.art:first-child{border-top:0}
.art img{width:84px;height:62px;object-fit:cover;border-radius:12px;margin-right:16px;flex:none;background:#1a2230}
.art div{min-width:0}
.at{font-size:19px;line-height:1.28;max-height:2.56em;overflow:hidden}
.am{font-size:14px;color:#7d8da3;margin-top:4px}
#now{font-size:23px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:30px}
#bar{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:2px;background:rgba(255,255,255,.14);margin:20px 0 14px;outline:0}
#bar::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#8cc8ff}
.ctl{display:flex;align-items:center;justify-content:center}
.ctl button{font-size:30px;margin:0 20px;color:#c9d4e3}
.ctl #pp{font-size:34px;width:68px;height:68px;border-radius:50%;background:#8cc8ff;color:#0a1422;margin:0 12px}
#shuf.on{color:#8cc8ff}
#list{max-height:150px;overflow-y:auto;-webkit-overflow-scrolling:touch;margin:14px 0 8px}
.it{display:flex;align-items:center;padding:11px 4px;font-size:17px;color:#aab9cc;border-top:1px solid rgba(255,255,255,.06)}
.it .i{margin-right:10px;color:#7d8da3}
.it.on{color:#8cc8ff}
.it .x{margin-left:auto;padding-left:14px}
textarea{width:100%;height:96px;background:none;border:0;color:#e9eef5;font:inherit;font-size:19px;resize:none;outline:0}
.empty{color:#7d8da3;font-size:16px;padding:6px 0}
.hrs{display:grid;grid-template-columns:repeat(6,1fr);grid-gap:8px}
.hr{text-align:center;font-size:17px;color:#c9d4e3;padding:12px 2px;border-radius:16px;background:rgba(255,255,255,.04)}
.hr b{display:block;font-weight:500;font-size:13px;color:#7d8da3;letter-spacing:.06em}
.hr .i{display:block;font-size:26px;margin:8px auto;color:#8cc8ff}
.hr em{display:block;font-style:normal;font-size:13px;color:#7d8da3;margin-top:3px}
#stats{display:grid;grid-template-columns:repeat(3,1fr);grid-gap:10px;margin-top:12px}
.st{padding:12px 6px;text-align:center;border-radius:16px;background:rgba(255,255,255,.04)}
.st .i{display:block;font-size:24px;color:#8cc8ff;margin:0 auto 6px}
.st b{display:block;font-weight:500;font-size:16px}
.st span{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#7d8da3}
#hol{display:flex;align-items:center;margin-top:16px;font-size:17px;color:#c9d4e3}
#hol .i{margin-right:10px;color:#8cc8ff;font-size:22px}
#amf{width:100%;height:460px;border:0;border-radius:14px;display:none;margin-top:6px}
a.chip{text-decoration:none}
#trow{display:flex;align-items:center;margin-bottom:8px}
#tin{flex:1;min-width:0;background:rgba(255,255,255,.06);border:0;border-radius:14px;color:#e9eef5;font:inherit;font-size:18px;padding:13px 15px;outline:0}
#tadd{font-size:22px;margin-left:10px;width:46px;height:46px;border-radius:50%;background:#8cc8ff;color:#0a1422;flex:none}
.tk{display:flex;align-items:center;padding:13px 2px;border-top:1px solid rgba(255,255,255,.06);font-size:20px}
.tk .i{font-size:26px;color:#7d8da3;margin-right:14px;flex:none}
.tk span{flex:1;min-width:0;word-wrap:break-word}
.tk b{padding-left:14px;color:#566378;font-weight:400}
.tk.done span{text-decoration:line-through;color:#6a788c}
.tk.done .i{color:#8cc8ff}
</style></head><body>

<symbol id="pin" viewBox="0 0 24 24"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></symbol>
<symbol id="news" viewBox="0 0 24 24"><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2Zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2M18 14h-8m5 4h-5M10 6h8v4h-8z"/></symbol>
<symbol id="music" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></symbol>

<main>
<div class="col">
  <section>
    <div id="hello"></div>
    <div id="time">--:--</div>
    <div id="date"></div>
    <div id="wx">
      <span id="ico"></span>
      <div><div id="temp">--°</div><div id="cond">Météo…</div></div>
      <button class="chip" id="city"></button>
    </div>
    <div id="days"></div>
    <div id="tip"></div>
  </section>
  <section class="card">
    <h3 class="lbl"><svg class="i"><use xlink:href="#ok"/></svg>Tâches</h3>
    <div id="trow"><input id="tin" type="text" placeholder="Nouvelle tâche…" autocomplete="off"><button id="tadd"><svg class="i"><use xlink:href="#plus"/></svg></button></div>
    <div id="tasks"></div>
    <button class="chip" id="tclr" style="display:none;margin-top:12px">Effacer les tâches faites</button>
  </section>
</div>
<div class="col">
  <section class="card">
    <h3 class="lbl"><svg class="i"><use xlink:href="#music"/></svg>Apple Music</h3>
    <div id="pls"></div>
    <iframe id="amf" allow="autoplay *; encrypted-media *; fullscreen *" sandbox="allow-forms allow-popups allow-same-origin allow-scripts allow-storage-access-by-user-activation allow-top-navigation-by-user-activation"></iframe>
    <div class="empty" id="amhelp">Dans l’app Musique : touchez ••• sur une playlist, puis Partager &gt; Copier le lien. Ici, touchez « + Playlist » et collez le lien. Connectez-vous une fois à Apple Music dans le lecteur pour écouter les titres en entier.</div>
    <a class="chip" href="music://" style="margin-top:12px">Ouvrir l’app Musique</a>
  </section>
</div>
</main>
<script>
var $=function(i){return document.getElementById(i)};
function pad(n){return n<10?"0"+n:""+n}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function ic(id,c){return '<svg class="i '+(c||"")+'"><use xlink:href="#'+id+'"/></svg>'}
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
function jget(k,d){try{return JSON.parse(store(k))||d}catch(e){return d}}

/* Heure et date */
function tick(){
  var d=new Date(),h=d.getHours();
  $("time").textContent=pad(h)+":"+pad(d.getMinutes());
  $("date").textContent=d.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});
  $("hello").textContent=h<5?"Bonne nuit":h<12?"Bonjour":h<18?"Bon après-midi":"Bonsoir";
  document.body.className=(h>=22||h<7)?"night":"";
}
tick();setInterval(tick,10000);

/* Météo (Open-Meteo, sans clé) — Rouen par défaut */
var LOC=jget("loc",{lat:49.4432,lon:1.0993,name:"Rouen"});
function wxi(c){
  if(c===0)return["sun","Ciel dégagé"];if(c<3)return["csun","Éclaircies"];if(c===3)return["cloud","Couvert"];
  if(c<50)return["fog","Brouillard"];if(c<60)return["drizzle","Bruine"];if(c<70)return["rain","Pluie"];
  if(c<80)return["snow","Neige"];if(c<85)return["rain","Averses"];if(c<90)return["snow","Averses de neige"];return["storm","Orage"];
}
function loadWx(){
  $("city").innerHTML=ic("pin")+esc(LOC.name);
  var u="https://api.open-meteo.com/v1/forecast?latitude="+LOC.lat+"&longitude="+LOC.lon+
    "&current=temperature_2m,weather_code,wind_speed_10m&hourly=temperature_2m,precipitation_probability,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset,uv_index_max&timezone=auto&forecast_days=4";
  fetch(u).then(function(r){return r.json()}).then(function(j){
    var w=wxi(j.current.weather_code),D=j.daily;
    $("ico").innerHTML=ic(w[0]);$("temp").textContent=Math.round(j.current.temperature_2m)+"°";$("cond").textContent=w[1];
    var h="";
    for(var i=1;i<4;i++){
      var dn=new Date(D.time[i]+"T12:00:00").toLocaleDateString("fr-FR",{weekday:"short"}).replace(".","");
      h+='<div class="day"><b>'+dn+"</b>"+ic(wxi(D.weather_code[i])[0])+Math.round(D.temperature_2m_min[i])+"° · "+Math.round(D.temperature_2m_max[i])+"°</div>";
    }
    $("days").innerHTML=h;
    var p=D.precipitation_probability_max[0],mn=D.temperature_2m_min[0],mx=D.temperature_2m_max[0],t;
    if(p>=50)t=["umbrella","Prenez un parapluie ("+p+" % de pluie aujourd’hui)"];
    else if(mn<=3)t=["thermo","Il gèle ce matin, couvrez-vous"];
    else if(mx>=28)t=["drop","Journée chaude, pensez à boire"];
    else t=["ok","Rien de particulier, belle journée !"];
    $("tip").innerHTML=ic(t[0])+"<span>"+t[1]+"</span>";
  }).catch(function(){$("cond").textContent="Météo indisponible"});
}
$("city").onclick=function(){
  var n=prompt("Quelle ville ?");if(!n)return;
  fetch("https://geocoding-api.open-meteo.com/v1/search?count=1&language=fr&name="+encodeURIComponent(n))
  .then(function(r){return r.json()}).then(function(j){
    if(!j.results){alert("Ville introuvable");return}
    var r=j.results[0];LOC={lat:r.latitude,lon:r.longitude,name:r.name};store("loc",JSON.stringify(LOC));loadWx();
  }).catch(function(){alert("Réseau indisponible")});
};
loadWx();setInterval(loadWx,20*60000);

/* Apple Music : lecteur intégré (playlists, albums) */
var plIdx=-1;
function pls(){return jget("pls",[])}
function renderPls(){
  var p=pls(),h="";
  for(var i=0;i<p.length;i++)h+='<button class="chip'+(i===plIdx?" on":"")+'" data-a="'+i+'">'+esc(p[i].n)+'<span data-ax="'+i+'" style="margin-left:8px">'+ic("x")+"</span></button>";
  $("pls").innerHTML=h+'<button class="chip" id="addpl">'+ic("plus")+"Playlist</button>";
  $("amhelp").style.display=plIdx<0?"block":"none";
}
function selPl(i){
  var p=pls();plIdx=i;store("plIdx",String(i));
  var f=$("amf");
  if(i>=0&&p[i]){if(f.getAttribute("data-u")!==p[i].u){f.src=p[i].u;f.setAttribute("data-u",p[i].u)}f.style.display="block"}
  else{f.style.display="none";f.src="about:blank";f.removeAttribute("data-u")}
  renderPls();
}
$("pls").onclick=function(e){
  var el=e.target;
  while(el&&el!==this){
    if(el.getAttribute){
      var x=el.getAttribute("data-ax");
      if(x!==null){var p=pls();p.splice(+x,1);store("pls",JSON.stringify(p));selPl(-1);return}
      if(el.id==="addpl"){
        var n=prompt("Nom de la playlist ?");if(!n)return;
        var u=prompt("Collez le lien Apple Music (Partager > Copier le lien)");if(!u)return;
        if(u.indexOf("music.apple.com")<0){alert("Ce n’est pas un lien Apple Music");return}
        u=u.replace(/^\s+|\s+$/g,"").replace("//music.apple.com","//embed.music.apple.com");
        var q=pls();q.push({n:n,u:u});store("pls",JSON.stringify(q));selPl(q.length-1);return;
      }
      var a=el.getAttribute("data-a");
      if(a!==null){selPl(+a);return}
    }
    el=el.parentNode;
  }
};
renderPls();
(function(){var p=pls(),i=parseInt(store("plIdx"),10);if(p.length)selPl(i>=0&&i<p.length?i:0)})();

/* Tâches à cocher */
function tasks(){return jget("tasks",[])}
function saveT(t){store("tasks",JSON.stringify(t))}
function renderT(){
  var t=tasks(),h="",dn=0;
  for(var i=0;i<t.length;i++){
    if(t[i].d)dn++;
    h+='<div class="tk'+(t[i].d?" done":"")+'" data-k="'+i+'">'+ic(t[i].d?"ok":"circle")+"<span>"+esc(t[i].t)+'</span><b data-d="'+i+'">'+ic("x")+"</b></div>";
  }
  $("tasks").innerHTML=h||'<div class="empty">Rien à faire pour l’instant</div>';
  $("tclr").style.display=dn?"inline-flex":"none";
}
function addT(){
  var v=$("tin").value.replace(/^\s+|\s+$/g,"");if(!v)return;
  var t=tasks();t.push({t:v,d:0});saveT(t);$("tin").value="";renderT();
}
$("tadd").onclick=addT;
$("tin").onkeydown=function(e){if(e.keyCode===13)addT()};
$("tclr").onclick=function(){saveT(tasks().filter(function(x){return!x.d}));renderT()};
$("tasks").onclick=function(e){
  var el=e.target;
  while(el&&el!==this){
    if(el.getAttribute){
      var d=el.getAttribute("data-d");
      if(d!==null){var t=tasks();t.splice(+d,1);saveT(t);renderT();return}
      var k=el.getAttribute("data-k");
      if(k!==null){var u=tasks();u[+k].d=u[+k].d?0:1;saveT(u);renderT();return}
    }
    el=el.parentNode;
  }
};
renderT();

/* Garder l’écran allumé si possible */
function wake(){try{navigator.wakeLock&&navigator.wakeLock.request("screen")}catch(e){}}
document.addEventListener("click",wake);document.addEventListener("visibilitychange",wake);
</script></body></html>
