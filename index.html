<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Entrée</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#090c11;min-height:100%}
body{margin:0;min-height:100vh;color:#e9eef5;font-family:-apple-system,"SF Pro Display",Helvetica,Arial,sans-serif;background:radial-gradient(900px 520px at 8% -8%,#1b2b47 0%,rgba(9,12,17,0) 70%) no-repeat;padding:max(18px,env(safe-area-inset-top)) 26px 26px}
body.night{-webkit-filter:brightness(.4);filter:brightness(.4)}
.i{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.14em}
.i.f{fill:currentColor}
main{display:grid;grid-template-columns:1fr 1fr;grid-gap:26px}
@media (orientation:portrait){main{grid-template-columns:1fr}}
.col>*{margin-bottom:20px}
.card{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.07);border-radius:26px;padding:22px}
.lbl{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#7d8da3;margin:0 0 14px;display:flex;align-items:center}
.lbl .i{margin-right:8px;font-size:16px}
#hello{font-size:22px;color:#8ea2bb;letter-spacing:.02em}
#time{font-size:23vmin;font-weight:100;line-height:1;letter-spacing:-.03em;margin:4px 0 6px}
#date{font-size:26px;text-transform:capitalize;color:#c9d4e3}
#wx{display:flex;align-items:center;margin-top:30px}
#ico{font-size:68px;color:#8cc8ff;margin-right:20px}
#temp{font-size:58px;font-weight:200;line-height:1}
#cond{font-size:19px;color:#8ea2bb;margin-top:4px}
#city{margin-left:auto;align-self:flex-start}
#days{display:grid;grid-template-columns:repeat(3,1fr);grid-gap:12px;margin-top:20px}
.day{text-align:center;padding:14px 6px;border-radius:18px;background:rgba(255,255,255,.04);font-size:15px;color:#c9d4e3}
.day b{display:block;font-weight:500;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:#7d8da3}
.day .i{display:block;font-size:30px;margin:8px auto;color:#8cc8ff}
#tip{margin-top:16px;font-size:19px;color:#dbe6f5;display:flex;align-items:center}
#tip .i{font-size:26px;color:#8cc8ff;margin-right:12px;flex:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.chip{display:inline-flex;align-items:center;font-size:16px;color:#aab9cc;background:rgba(255,255,255,.06);border-radius:999px;padding:9px 15px;margin:0 8px 8px 0}
.chip .i{margin-right:7px;font-size:17px}
.chip.on{background:#8cc8ff;color:#0a1422}
#tabs{margin-bottom:6px}
.art{display:flex;align-items:center;text-decoration:none;color:inherit;padding:13px 0;border-top:1px solid rgba(255,255,255,.07)}
.art:first-child{border-top:0}
.art img{width:84px;height:62px;object-fit:cover;border-radius:12px;margin-right:16px;flex:none;background:#1a2230}
.art div{min-width:0}
.at{font-size:19px;line-height:1.28;max-height:2.56em;overflow:hidden}
.am{font-size:14px;color:#7d8da3;margin-top:4px}
#now{font-size:23px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:30px}
#bar{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:2px;background:rgba(255,255,255,.14);margin:20px 0 14px;outline:0}
#bar::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#8cc8ff}
.ctl{display:flex;align-items:center;justify-content:center}
.ctl button{font-size:30px;margin:0 20px;color:#c9d4e3}
.ctl #pp{font-size:34px;width:68px;height:68px;border-radius:50%;background:#8cc8ff;color:#0a1422;margin:0 12px}
#shuf.on{color:#8cc8ff}
#list{max-height:150px;overflow-y:auto;-webkit-overflow-scrolling:touch;margin:14px 0 8px}
.it{display:flex;align-items:center;padding:11px 4px;font-size:17px;color:#aab9cc;border-top:1px solid rgba(255,255,255,.06)}
.it .i{margin-right:10px;color:#7d8da3}
.it.on{color:#8cc8ff}
.it .x{margin-left:auto;padding-left:14px}
textarea{width:100%;height:96px;background:none;border:0;color:#e9eef5;font:inherit;font-size:19px;resize:none;outline:0}
.empty{color:#7d8da3;font-size:16px;padding:6px 0}
</style></head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<symbol id="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2m-7.07-17.07 1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></symbol>
<symbol id="cloud" viewBox="0 0 24 24"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></symbol>
<symbol id="csun" viewBox="0 0 24 24"><path d="M12 2v2m-7.07.93 1.41 1.41M20 12h2m-2.93-7.07-1.41 1.41M15.95 12.65a4 4 0 0 0-5.93-4.13M13 22H7a5 5 0 1 1 4.9-6H13a3 3 0 0 1 0 6Z"/></symbol>
<symbol id="fog" viewBox="0 0 24 24"><path d="M4 14.9A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.24M16 17H7m10 4H9"/></symbol>
<symbol id="drizzle" viewBox="0 0 24 24"><path d="M4 14.9A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.24M8 19v1m0-6v1m8 4v1m0-6v1m-4 7v1m0-6v1"/></symbol>
<symbol id="rain" viewBox="0 0 24 24"><path d="M4 14.9A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.24M16 14v6m-8-6v6m4-4v6"/></symbol>
<symbol id="snow" viewBox="0 0 24 24"><path d="M2 12h20M12 2v20m8-6-4-4 4-4M4 8l4 4-4 4m12-12-4 4-4-4M8 20l4-4 4 4"/></symbol>
<symbol id="storm" viewBox="0 0 24 24"><path d="M6 16.33A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 .5 8.97M13 12l-3 5h4l-3 5"/></symbol>
<symbol id="umbrella" viewBox="0 0 24 24"><path d="M22 12a10.06 10.06 0 0 0-20 0ZM12 12v8a2 2 0 0 0 4 0M12 2v1"/></symbol>
<symbol id="thermo" viewBox="0 0 24 24"><path d="M14 4v10.54a4 4 0 1 1-4 0V4a2 2 0 0 1 4 0Z"/></symbol>
<symbol id="drop" viewBox="0 0 24 24"><path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/></symbol>
<symbol id="ok" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14M22 4 12 14.01l-3-3"/></symbol>
<symbol id="play" viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></symbol>
<symbol id="pause" viewBox="0 0 24 24"><rect x="14" y="4" width="4" height="16" rx="1"/><rect x="6" y="4" width="4" height="16" rx="1"/></symbol>
<symbol id="next" viewBox="0 0 24 24"><path d="M5 4l10 8-10 8zM19 5v14"/></symbol>
<symbol id="prev" viewBox="0 0 24 24"><path d="M19 20 9 12l10-8zM5 19V5"/></symbol>
<symbol id="shuffle" viewBox="0 0 24 24"><path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l6.1-8.6c.7-1.1 2-1.7 3.3-1.7H22m-4-4 4 4-4 4M2 6h1.9c1.5 0 2.9.9 3.6 2.2M22 18h-5.9c-1.3 0-2.6-.7-3.3-1.8l-.5-.8M18 14l4 4-4 4"/></symbol>
<symbol id="plus" viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></symbol>
<symbol id="radio" viewBox="0 0 24 24"><path d="M4.9 19.1C1 15.2 1 8.8 4.9 4.9M7.8 16.2c-2.3-2.3-2.3-6.1 0-8.5m8.4.1c2.3 2.3 2.3 6.1 0 8.5M19.1 4.9C23 8.8 23 15.1 19.1 19"/><circle cx="12" cy="12" r="2"/></symbol>
<symbol id="pin" viewBox="0 0 24 24"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></symbol>
<symbol id="news" viewBox="0 0 24 24"><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2Zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2M18 14h-8m5 4h-5M10 6h8v4h-8z"/></symbol>
<symbol id="music" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></symbol>
<symbol id="note" viewBox="0 0 24 24"><path d="M15.5 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8.5zM15 3v6h6"/></symbol>
<symbol id="x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
</svg>

<main>
<div class="col">
  <section>
    <div id="hello"></div>
    <div id="time">--:--</div>
    <div id="date"></div>
    <div id="wx">
      <span id="ico"></span>
      <div><div id="temp">--°</div><div id="cond">Météo…</div></div>
      <button class="chip" id="city"></button>
    </div>
    <div id="days"></div>
    <div id="tip"></div>
  </section>
  <section class="card">
    <h3 class="lbl"><svg class="i"><use xlink:href="#note"/></svg>Mémo</h3>
    <textarea id="memo" placeholder="Courses, rendez-vous, un mot pour la famille…"></textarea>
  </section>
</div>
<div class="col">
  <section class="card">
    <h3 class="lbl"><svg class="i"><use xlink:href="#news"/></svg>Actualités</h3>
    <div id="tabs"></div>
    <div id="news"><div class="empty">Chargement…</div></div>
  </section>
  <section class="card">
    <h3 class="lbl"><svg class="i"><use xlink:href="#music"/></svg>Musique</h3>
    <div id="now">Aucune musique</div>
    <input type="range" id="bar" min="0" max="1000" value="0">
    <div class="ctl">
      <button id="shuf"><svg class="i"><use xlink:href="#shuffle"/></svg></button>
      <button id="prev"><svg class="i f"><use xlink:href="#prev"/></svg></button>
      <button id="pp"></button>
      <button id="next"><svg class="i f"><use xlink:href="#next"/></svg></button>
      <button id="radio" style="font-size:26px"><svg class="i"><use xlink:href="#radio"/></svg></button>
    </div>
    <div id="list"></div>
    <label class="chip"><svg class="i"><use xlink:href="#plus"/></svg>Fichiers audio<input type="file" id="files" accept="audio/*" multiple style="display:none"></label>
    <button class="chip" id="addradio"><svg class="i"><use xlink:href="#radio"/></svg>Ajouter une radio</button>
    <audio id="au"></audio>
  </section>
</div>
</main>
<script>
var $=function(i){return document.getElementById(i)};
function pad(n){return n<10?"0"+n:""+n}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function ic(id,c){return '<svg class="i '+(c||"")+'"><use xlink:href="#'+id+'"/></svg>'}
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
function jget(k,d){try{return JSON.parse(store(k))||d}catch(e){return d}}

/* Heure et date */
function tick(){
  var d=new Date(),h=d.getHours();
  $("time").textContent=pad(h)+":"+pad(d.getMinutes());
  $("date").textContent=d.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});
  $("hello").textContent=h<5?"Bonne nuit":h<12?"Bonjour":h<18?"Bon après-midi":"Bonsoir";
  document.body.className=(h>=22||h<7)?"night":"";
}
tick();setInterval(tick,10000);

/* Météo (Open-Meteo, sans clé) — Rouen par défaut */
var LOC=jget("loc",{lat:49.4432,lon:1.0993,name:"Rouen"});
function wxi(c){
  if(c===0)return["sun","Ciel dégagé"];if(c<3)return["csun","Éclaircies"];if(c===3)return["cloud","Couvert"];
  if(c<50)return["fog","Brouillard"];if(c<60)return["drizzle","Bruine"];if(c<70)return["rain","Pluie"];
  if(c<80)return["snow","Neige"];if(c<85)return["rain","Averses"];if(c<90)return["snow","Averses de neige"];return["storm","Orage"];
}
function loadWx(){
  $("city").innerHTML=ic("pin")+esc(LOC.name);
  var u="https://api.open-meteo.com/v1/forecast?latitude="+LOC.lat+"&longitude="+LOC.lon+
    "&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=4";
  fetch(u).then(function(r){return r.json()}).then(function(j){
    var w=wxi(j.current.weather_code),D=j.daily;
    $("ico").innerHTML=ic(w[0]);$("temp").textContent=Math.round(j.current.temperature_2m)+"°";$("cond").textContent=w[1];
    var h="";
    for(var i=1;i<4;i++){
      var dn=new Date(D.time[i]+"T12:00:00").toLocaleDateString("fr-FR",{weekday:"short"}).replace(".","");
      h+='<div class="day"><b>'+dn+"</b>"+ic(wxi(D.weather_code[i])[0])+Math.round(D.temperature_2m_min[i])+"° · "+Math.round(D.temperature_2m_max[i])+"°</div>";
    }
    $("days").innerHTML=h;
    var p=D.precipitation_probability_max[0],mn=D.temperature_2m_min[0],mx=D.temperature_2m_max[0],t;
    if(p>=50)t=["umbrella","Prenez un parapluie ("+p+" % de pluie aujourd’hui)"];
    else if(mn<=3)t=["thermo","Il gèle ce matin, couvrez-vous"];
    else if(mx>=28)t=["drop","Journée chaude, pensez à boire"];
    else t=["ok","Rien de particulier, belle journée !"];
    $("tip").innerHTML=ic(t[0])+"<span>"+t[1]+"</span>";
  }).catch(function(){$("cond").textContent="Météo indisponible"});
}
$("city").onclick=function(){
  var n=prompt("Quelle ville ?");if(!n)return;
  fetch("https://geocoding-api.open-meteo.com/v1/search?count=1&language=fr&name="+encodeURIComponent(n))
  .then(function(r){return r.json()}).then(function(j){
    if(!j.results){alert("Ville introuvable");return}
    var r=j.results[0];LOC={lat:r.latitude,lon:r.longitude,name:r.name};store("loc",JSON.stringify(LOC));loadWx();
  }).catch(function(){alert("Réseau indisponible")});
};
loadWx();setInterval(loadWx,20*60000);

/* Actualités (flux RSS via rss2json) */
var FEEDS=[
  {n:"Rouen",u:"https://news.google.com/rss/search?q=Rouen&hl=fr&gl=FR&ceid=FR:fr"},
  {n:"France Info",u:"https://www.francetvinfo.fr/titres.rss"},
  {n:"Le Monde",u:"https://www.lemonde.fr/rss/une.xml"}
];
var feedIdx=0;
function allFeeds(){return FEEDS.concat(jget("feeds",[]))}
function ago(s){
  var m=Math.round((Date.now()-new Date(String(s).replace(" ","T")+"Z").getTime())/60000);
  if(isNaN(m))return"";if(m<60)return"il y a "+Math.max(m,1)+" min";
  var h=Math.round(m/60);return h<24?"il y a "+h+" h":"il y a "+Math.round(h/24)+" j";
}
function tabs(){
  var f=allFeeds(),h="";
  for(var i=0;i<f.length;i++)h+='<button class="chip'+(i===feedIdx?" on":"")+'" data-t="'+i+'">'+esc(f[i].n)+(i>=FEEDS.length?'<span data-fx="'+i+'" style="margin-left:8px">'+ic("x")+"</span>":"")+"</button>";
  $("tabs").innerHTML=h+'<button class="chip" id="addfeed">'+ic("plus")+"Flux</button>";
}
function loadNews(){
  var f=allFeeds()[feedIdx];if(!f)return;
  fetch("https://api.rss2json.com/v1/api.json?rss_url="+encodeURIComponent(f.u)).then(function(r){return r.json()}).then(function(j){
    if(j.status!=="ok")throw 0;
    var h="",it=j.items.slice(0,6);
    for(var i=0;i<it.length;i++){
      var a=it[i],t=a.title,src=j.feed&&j.feed.title?"":"",k=t.lastIndexOf(" - ");
      if(k>20){src=t.slice(k+3);t=t.slice(0,k)}
      var im=a.thumbnail||(a.enclosure&&a.enclosure.link&&/\.(jpe?g|png|webp)/i.test(a.enclosure.link)?a.enclosure.link:"");
      h+='<a class="art" target="_blank" rel="noopener" href="'+esc(a.link)+'">'+(im?'<img src="'+esc(im)+'" onerror="this.style.display=\'none\'">':"")+
        '<div><div class="at">'+esc(t)+'</div><div class="am">'+esc(src?src+" · ":"")+ago(a.pubDate)+"</div></div></a>";
    }
    $("news").innerHTML=h||'<div class="empty">Aucun article</div>';
  }).catch(function(){$("news").innerHTML='<div class="empty">Actualités indisponibles pour le moment</div>'});
}
$("tabs").onclick=function(e){
  var el=e.target;
  while(el&&el!==this){
    if(el.getAttribute){
      var x=el.getAttribute("data-fx");
      if(x!==null){var c=jget("feeds",[]);c.splice(+x-FEEDS.length,1);store("feeds",JSON.stringify(c));feedIdx=0;tabs();loadNews();return}
      if(el.id==="addfeed"){
        var n=prompt("Nom du flux ?"),u=n&&prompt("Adresse du flux RSS (https://…)");
        if(n&&u){var c2=jget("feeds",[]);c2.push({n:n,u:u});store("feeds",JSON.stringify(c2));feedIdx=FEEDS.length+c2.length-1;tabs();loadNews()}
        return;
      }
      var t=el.getAttribute("data-t");
      if(t!==null){feedIdx=+t;tabs();loadNews();return}
    }
    el=el.parentNode;
  }
};
tabs();loadNews();setInterval(loadNews,15*60000);

/* Musique : fichiers de l’iPad + radios (flux web) */
var au=$("au"),files=[],items=[],cur=-1,shuf=false;
function radios(){return jget("radios",[])}
function build(){
  items=radios().map(function(r){return{n:r.n,s:r.u,r:1}}).concat(files);
  var h="";
  for(var i=0;i<items.length;i++){
    h+='<div class="it'+(i===cur?" on":"")+'" data-p="'+i+'">'+ic(items[i].r?"radio":"music")+esc(items[i].n)+(items[i].r?'<span class="x" data-x="'+i+'">'+ic("x")+"</span>":"")+"</div>";
  }
  $("list").innerHTML=h;
  $("now").textContent=cur>=0&&items[cur]?items[cur].n:"Aucune musique";
}
function play(i){if(!items[i])return;cur=i;au.src=items[i].s;au.play();build()}
function nxt(d){
  if(!items.length)return;
  play(shuf?Math.floor(Math.random()*items.length):(cur+d+items.length)%items.length);
}
$("pp").innerHTML=ic("play","f");
$("pp").onclick=function(){if(cur<0){play(0)}else if(au.paused){au.play()}else{au.pause()}};
$("next").onclick=function(){nxt(1)};$("prev").onclick=function(){nxt(-1)};
$("shuf").onclick=function(){shuf=!shuf;this.className=shuf?"on":""};
$("radio").onclick=function(){$("addradio").click()};
au.onplay=function(){$("pp").innerHTML=ic("pause","f")};au.onpause=function(){$("pp").innerHTML=ic("play","f")};
au.onended=function(){nxt(1)};
au.ontimeupdate=function(){if(isFinite(au.duration)&&au.duration>0)$("bar").value=au.currentTime/au.duration*1000};
$("bar").oninput=function(){if(isFinite(au.duration))au.currentTime=au.duration*this.value/1000};
$("files").onchange=function(){
  for(var i=0;i<this.files.length;i++){var f=this.files[i];files.push({n:f.name.replace(/\.[^.]+$/,""),s:URL.createObjectURL(f)})}
  build();if(cur<0)play(0);
};
$("addradio").onclick=function(){
  var n=prompt("Nom de la radio ?");if(!n)return;
  var u=prompt("Adresse du flux (https://…)");if(!u)return;
  var r=radios();r.push({n:n,u:u});store("radios",JSON.stringify(r));build();
};
$("list").onclick=function(e){
  var el=e.target;
  while(el&&el!==this){
    var x=el.getAttribute&&el.getAttribute("data-x");
    if(x){var r=radios();r.splice(+x,1);store("radios",JSON.stringify(r));cur=-1;au.pause();build();return}
    var p=el.getAttribute&&el.getAttribute("data-p");
    if(p!==null&&p!==undefined){play(+p);return}
    el=el.parentNode;
  }
};
build();

/* Mémo */
$("memo").value=store("memo")||"";
$("memo").oninput=function(){store("memo",this.value)};

/* Garder l’écran allumé si possible */
function wake(){try{navigator.wakeLock&&navigator.wakeLock.request("screen")}catch(e){}}
document.addEventListener("click",wake);document.addEventListener("visibilitychange",wake);
</script></body></html>
